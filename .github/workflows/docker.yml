name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/bclark303/reelindex

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify synchronized package copies
        run: python scripts/sync-packages.py --check
      - name: Build amd64 smoke image
        run: docker build --pull --tag reelindex:smoke .
      - name: Start smoke container
        run: |
          mkdir -p "${RUNNER_TEMP}/reelindex-data" "${RUNNER_TEMP}/reelindex-media"
          docker run --detach --name reelindex-smoke \
            --publish 18080:8080 \
            --env PUID="$(id -u)" --env PGID="$(id -g)" \
            --volume "${RUNNER_TEMP}/reelindex-data:/data" \
            --volume "${RUNNER_TEMP}/reelindex-media:/media:ro" \
            reelindex:smoke
      - name: Validate health, schema, tools, and shared UI
        run: |
          rm -f health.json scans.json stats.json
          healthy=false
          for attempt in {1..75}; do
            running="$(docker inspect --format '{{.State.Running}}' reelindex-smoke 2>/dev/null || true)"
            if [[ "$running" != "true" ]]; then
              echo "ReelIndex container exited before becoming healthy."
              docker inspect reelindex-smoke || true
              docker logs reelindex-smoke || true
              exit 1
            fi
            if curl --fail --silent --show-error \
              --output health.json http://127.0.0.1:18080/api/health; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]] || [[ ! -s health.json ]]; then
            echo "ReelIndex did not return a health payload."
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' reelindex-smoke || true
            docker logs reelindex-smoke || true
            exit 1
          fi
          curl --fail --silent --show-error --output scans.json http://127.0.0.1:18080/api/scans
          curl --fail --silent --show-error --output stats.json http://127.0.0.1:18080/api/stats
          python - <<'PY'
          import json
          health = json.load(open('health.json', encoding='utf-8'))
          scans = json.load(open('scans.json', encoding='utf-8'))
          stats = json.load(open('stats.json', encoding='utf-8'))
          assert health['status'] == 'ok', health
          assert health['version'] == '1.4.8', health
          assert health['edition'] == 'Docker / Unraid', health
          assert isinstance(scans, list), scans
          assert isinstance(stats, dict), stats
          PY
          docker exec reelindex-smoke python -c "import sqlite3; db=sqlite3.connect('/data/reelindex.db'); tables={row[0] for row in db.execute(\"select name from sqlite_master where type='table'\")}; required={'sources','movies','movie_sources','media_files','media_file_sources','scan_runs'}; missing=required-tables; assert not missing, missing; mode=db.execute('pragma journal_mode').fetchone()[0].lower(); assert mode == 'delete', mode"
          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -q 'ReelIndex 1.4.8'
          docker exec reelindex-smoke ffprobe -version
          docker exec reelindex-smoke mediainfo --Version
          test -f "${RUNNER_TEMP}/reelindex-data/reelindex.db"
          test -f "${RUNNER_TEMP}/reelindex-data/.secret_key"
      - name: Show container logs on failure
        if: failure()
        run: |
          docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' reelindex-smoke || true
          docker logs reelindex-smoke || true
      - name: Stop smoke container
        if: always()
        run: docker rm --force reelindex-smoke >/dev/null 2>&1 || true

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=unraid,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
