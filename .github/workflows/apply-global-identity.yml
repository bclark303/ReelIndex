name: Apply global library identity patch

on:
  push:
    branches: [agent/global-library-identity]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-library-identity
      - name: Patch canonical scan indexing
        run: |
          if grep -q 'LibraryIdentityIndex' backend/app/services/scanner.py; then
            echo 'Scanner patch is already applied.'
          else
            python scripts/apply_global_identity_patch.py
          fi
      - name: Synchronize Windows payload
        run: python scripts/sync-packages.py
      - name: Compile Python sources
        run: python -m compileall -q backend/app windows/app/app
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app windows/app/app windows/app/web windows/web
          git commit -m 'Apply canonical scan identity indexing'
          git push origin HEAD:agent/global-library-identity
