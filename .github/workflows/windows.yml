name: Secure Windows installer

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_duplicate_repair.py
      - .github/workflows/windows.yml

permissions:
  contents: write

jobs:
  build-scan:
    if: ${{ !contains(github.event.pull_request.head.sha, '[applied]') }}
    runs-on: ubuntu-latest
    env:
      REELINDEX_DATA_DIR: ${{ runner.temp }}/reelindex-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair and synchronize packages
        run: |
          if git log -1 --pretty=%B | grep -q '\[applied\]'; then
            echo 'Repair already applied.'
            exit 0
          fi
          python scripts/apply_duplicate_repair.py
          python scripts/sync-packages.py
          python scripts/sync-packages.py --check
      - name: Run focused regressions
        run: |
          if git log -1 --pretty=%B | grep -q '\[applied\]'; then
            exit 0
          fi
          python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
          cd backend
          pytest -q tests/test_filesystem_identity_repair.py tests/test_global_library_identity.py tests/test_release_identity.py
      - name: Commit repaired source
        run: |
          if git log -1 --pretty=%B | grep -q '\[applied\]'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md VERSION Dockerfile docker-compose.yml \
            backend/app backend/pyproject.toml backend/tests \
            web windows/app windows/web windows/installer/installer.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Repair filesystem identity and reconcile after scans [applied]'
          git push origin HEAD:fix/filesystem-title-reconciliation
