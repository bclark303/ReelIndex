name: Apply content signature dedup

on:
  push:
    branches: [agent/content-signature-dedup]

permissions:
  contents: write

concurrency:
  group: content-signature-dedup
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/content-signature-dedup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Apply and verify content-signature deduplication
        shell: bash
        run: |
          set -euo pipefail
          export REELINDEX_DATA_DIR="$RUNNER_TEMP/reelindex-test-data"
          python scripts/patch_content_signature_dedup.py
          python scripts/sync-packages.py
          python -m compileall -q backend/app windows/app/app
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          (cd backend && pytest -q tests/test_global_library_identity.py tests/test_release_identity.py)
      - name: Commit generated application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md Dockerfile docker-compose.yml backend web windows
          git commit -m 'Deduplicate cross-source files by trusted content signature'
          git push origin HEAD:agent/content-signature-dedup
