name: Windows installer (quarantined)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: windows-latest
    steps:
      - name: Block unsafe installer publication
        shell: pwsh
        run: |
          Write-Error @'
          Windows installer publishing is quarantined after Microsoft Defender
          detected the unsigned self-extracting setup executable as
          Trojan:Win32/Sabsik.FL.A!ml. Do not restore this workflow until the
          installer no longer uses ExecutionPolicy Bypass or downloaded script
          execution, dependencies are integrity-pinned, and the final artifact
          passes Microsoft Defender scanning on a Windows runner.
          '@
          exit 1
