name: Finalize global identity release

on:
  push:
    branches: [agent/global-library-identity]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-library-identity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Apply release and identity safety changes
        run: |
          python scripts/finalize_global_identity.py
          python scripts/sync-packages.py
          python -m compileall -q backend/app windows/app/app
      - name: Run focused regression tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest -q tests/test_global_library_identity.py tests/test_release_identity.py
      - name: Commit finalized release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION README.md Dockerfile docker-compose.yml backend web windows
          git commit -m 'Finalize global library identity v1.4.7'
          git push origin HEAD:agent/global-library-identity
