name: Apply canonical source query fixes

on:
  push:
    branches: [agent/global-library-identity]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-library-identity
      - name: Apply remaining source membership fixes
        run: python scripts/patch_canonical_source_queries.py
      - name: Synchronize Windows payload
        run: python scripts/sync-packages.py
      - name: Compile Python sources
        run: python -m compileall -q backend/app windows/app/app
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app windows/app/app .github/workflows/docker.yml
          git commit -m 'Use canonical source memberships throughout the app'
          git push origin HEAD:agent/global-library-identity
