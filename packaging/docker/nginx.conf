worker_processes auto;
pid /tmp/nginx.pid;
error_log /data/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 25m;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        location = /docs { proxy_pass http://127.0.0.1:8000/docs; }
        location = /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; }
        location = /redoc { proxy_pass http://127.0.0.1:8000/redoc; }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico|webmanifest)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }
}
