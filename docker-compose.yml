services:
  reelindex:
    image: ghcr.io/bclark303/reelindex:1.4.9
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reelindex
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-America/Toronto}
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      UMASK: ${UMASK:-002}
      REELINDEX_EDITION: ${REELINDEX_EDITION:-Docker / Unraid}
      REELINDEX_DEMO_MODE: ${DEMO_MODE:-false}
      REELINDEX_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REELINDEX_SCAN_VERBOSE: ${SCAN_VERBOSE:-false}
      REELINDEX_TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      REELINDEX_DISCOVERY_WORKERS: ${DISCOVERY_WORKERS:-8}
      REELINDEX_PROBE_WORKERS: ${PROBE_WORKERS:-4}
      REELINDEX_POSTER_WORKERS: ${POSTER_WORKERS:-6}
    volumes:
      - type: bind
        source: ${APPDATA_PATH:-./data}
        target: /data
      - type: bind
        source: ${MEDIA_PATH:-./media}
        target: /media
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
